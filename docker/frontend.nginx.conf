# IQOO frontend — SPA + API proxy (mirrors the Vite dev proxy contract).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets; never cache index.html itself.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SSE stream: buffering off so events arrive live (RealtimeContext).
    location /realtime/stream {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Health probe pass-through (StatusContext refines navigator.onLine with this).
    location = /healthz {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
    }

    # Same-origin API — the browser never talks cross-origin.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 5m;   # Missing-person photo cap is 150 KB; headroom for envelopes
    }

    # SPA fallback: every unknown route serves index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
