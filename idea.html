<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResQNET — Offline AI Emergency Network | iQOO Hackathon 2026</title>
    <style>
        /* ============================================================
     ResQNET judge deck — light professional theme, 25 slides
     covering the 10 required sections (PART 1–10) in order.
     Every slide renders through the reusable slideCard() component
     from a single data array. No emojis: typographic symbols only.
     ============================================================ */
        
         :root {
            --bg: #f6f8fb;
            --bg-alt: #eef2f7;
            --surface: #ffffff;
            --line: #dde5ee;
            --text: #16222f;
            --dim: #5a6b7e;
            --red: #c8102e;
            --red-soft: #fbe4e9;
            --red-deep: #8f0c20;
            --blue: #1667c1;
            --blue-soft: #e3eefb;
            --green: #157a44;
            --green-soft: #e0f3e9;
            --amber: #a8720a;
            --amber-soft: #fdf2d8;
            --purple: #6d3fc0;
            --purple-soft: #efe8fb;
            --orange: #c24d10;
            --orange-soft: #fdeee2;
            --shadow: 0 12px 34px rgba(22, 34, 47, 0.09);
        }
        
        * {
            box-sizing: border-box;
        }
        
        html,
        body {
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.55;
            font-size: 16px;
        }
        /* ---------- top progress bar ---------- */
        
        .deckbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 18px;
        }
        
        .deckbar .brand {
            font-weight: 900;
            letter-spacing: 0.06em;
            color: var(--red);
            white-space: nowrap;
        }
        
        .deckbar .brand span {
            color: var(--text);
        }
        
        .progress {
            flex: 1;
            height: 6px;
            background: var(--bg-alt);
            border-radius: 999px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--red), #ff6b81);
            transition: width 0.25s ease;
        }
        
        .counter {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--dim);
            white-space: nowrap;
        }
        /* ---------- FULL-SCREEN SLIDES ---------- */
        
        .slide {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 84px 7vw 64px;
            border-bottom: 1px solid var(--line);
            background: radial-gradient(1100px 480px at 85% -10%, var(--acc-soft, var(--red-soft)) 0%, transparent 60%), var(--bg);
            position: relative;
            overflow: hidden;
        }
        
        .slide .snum {
            position: absolute;
            top: 66px;
            right: 7vw;
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.16em;
            color: var(--dim);
        }
        
        .slide .kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.74rem;
            font-weight: 900;
            letter-spacing: 0.14em;
            color: var(--acc-deep, var(--red));
            background: var(--acc-soft, var(--red-soft));
            padding: 5px 14px;
            border-radius: 999px;
            margin: 0 0 14px;
            width: fit-content;
        }
        
        .slide h2 {
            margin: 0 0 10px;
            font-size: clamp(1.6rem, 3.6vw, 2.5rem);
            line-height: 1.2;
            letter-spacing: -0.01em;
        }
        
        .slide h2 em {
            color: var(--acc-deep, var(--red));
            font-style: normal;
        }
        
        .slide .lede {
            color: var(--dim);
            font-size: clamp(0.98rem, 1.6vw, 1.15rem);
            max-width: 900px;
            margin: 0 0 26px;
        }
        
        .slide .content {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
        }
        
        .slide .foot {
            margin-top: 26px;
            padding-top: 14px;
            border-top: 1px dashed var(--line);
            color: var(--dim);
            font-size: 0.85rem;
            max-width: 1120px;
            width: 100%;
        }
        
        .slide .foot b {
            color: var(--text);
        }
        
        .acc-red {
            --acc: var(--red);
            --acc-soft: var(--red-soft);
            --acc-deep: var(--red-deep);
        }
        
        .acc-blue {
            --acc: var(--blue);
            --acc-soft: var(--blue-soft);
            --acc-deep: var(--blue);
        }
        
        .acc-green {
            --acc: var(--green);
            --acc-soft: var(--green-soft);
            --acc-deep: var(--green);
        }
        
        .acc-amber {
            --acc: var(--amber);
            --acc-soft: var(--amber-soft);
            --acc-deep: var(--amber);
        }
        
        .acc-purple {
            --acc: var(--purple);
            --acc-soft: var(--purple-soft);
            --acc-deep: var(--purple);
        }
        
        .acc-orange {
            --acc: var(--orange);
            --acc-soft: var(--orange-soft);
            --acc-deep: var(--orange);
        }
        /* ---------- content blocks ---------- */
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 14px;
        }
        
        .grid3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        
        .mini {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--shadow);
        }
        
        .mini h4 {
            margin: 0 0 6px;
            font-size: 1rem;
        }
        
        .mini p {
            margin: 0;
            color: var(--dim);
            font-size: 0.9rem;
        }
        
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 0 18px;
        }
        
        .stat-chip {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 18px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        
        .stat-chip b {
            display: block;
            font-size: 1.45rem;
            color: var(--acc-deep, var(--red));
        }
        
        .stat-chip span {
            font-size: 0.72rem;
            color: var(--dim);
            letter-spacing: 0.05em;
        }
        
        .flow {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 4px 0 14px;
        }
        
        .fnode {
            flex: 1 1 140px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 3px solid var(--acc, var(--red));
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.82rem;
            color: var(--dim);
            position: relative;
            box-shadow: var(--shadow);
        }
        
        .fnode b {
            display: block;
            color: var(--acc-deep, var(--red));
            font-size: 0.86rem;
            margin-bottom: 2px;
            letter-spacing: 0.04em;
        }
        
        .fnode .arrow {
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--acc, var(--red));
            font-weight: 900;
            z-index: 2;
        }
        
        ul.ticks {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
        }
        
        ul.ticks li {
            padding: 2px 0 2px 28px;
            position: relative;
            color: var(--dim);
            font-size: 0.94rem;
        }
        
        ul.ticks li::before {
            content: '✓';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: var(--acc-soft, var(--red-soft));
            color: var(--acc-deep, var(--red));
            font-size: 0.72rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        ul.ticks li b {
            color: var(--text);
        }
        
        ul.xs {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
        }
        
        ul.xs li {
            padding: 2px 0 2px 28px;
            position: relative;
            color: var(--dim);
            font-size: 0.94rem;
        }
        
        ul.xs li::before {
            content: '✗';
            position: absolute;
            left: 2px;
            top: 2px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: var(--red-soft);
            color: var(--red-deep);
            font-size: 0.72rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        ul.xs li b {
            color: var(--text);
        }
        
        .code {
            background: #101b29;
            color: #c9d8e8;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: ui-monospace, 'DM Mono', Consolas, monospace;
            font-size: 0.78rem;
            overflow-x: auto;
            white-space: pre;
            line-height: 1.6;
            box-shadow: var(--shadow);
        }
        
        .code .k {
            color: #8ec2ff;
        }
        
        .code .c {
            color: #6d8599;
        }
        
        .plain {
            background: var(--acc-soft, var(--red-soft));
            border-left: 4px solid var(--acc, var(--red));
            border-radius: 0 12px 12px 0;
            padding: 10px 16px;
            margin-top: 16px;
            font-size: 0.93rem;
            color: var(--text);
            max-width: 900px;
        }
        
        .plain b:first-child {
            letter-spacing: 0.08em;
            font-size: 0.72rem;
            color: var(--acc-deep, var(--red));
            display: block;
            margin-bottom: 2px;
        }
        
        table.tech {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            background: var(--surface);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        table.tech th {
            text-align: left;
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: var(--acc-deep, var(--red));
            background: var(--acc-soft, var(--red-soft));
            padding: 9px 12px;
        }
        
        table.tech td {
            border-top: 1px solid var(--line);
            padding: 8px 12px;
            color: var(--dim);
        }
        
        table.tech td b {
            color: var(--text);
        }
        
        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 0.05em;
        }
        
        .p-green {
            background: var(--green-soft);
            color: var(--green);
        }
        
        .p-amber {
            background: var(--amber-soft);
            color: var(--amber);
        }
        
        .p-purple {
            background: var(--purple-soft);
            color: var(--purple);
        }
        
        .ps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        
        @media (max-width: 820px) {
            .ps-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .ps-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 20px 22px;
            box-shadow: var(--shadow);
        }
        
        .ps-card h3 {
            margin: 0 0 10px;
            font-size: 1.02rem;
            letter-spacing: 0.1em;
        }
        
        .ps-card ul {
            margin: 0;
            padding-left: 18px;
            color: var(--dim);
            font-size: 0.92rem;
            display: grid;
            gap: 6px;
        }
        
        .ps-card ul b {
            color: var(--text);
        }
        
        .ps-problem h3 {
            color: var(--red);
        }
        
        .ps-solution h3 {
            color: var(--green);
        }
        
        .journey {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        
        @media (max-width: 820px) {
            .journey {
                grid-template-columns: 1fr;
            }
        }
        
        .jstep {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--shadow);
        }
        
        .jstep .n {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            background: var(--acc, var(--red));
            margin-bottom: 8px;
        }
        
        .jstep h4 {
            margin: 0 0 4px;
            font-size: 0.95rem;
        }
        
        .jstep p {
            margin: 0;
            color: var(--dim);
            font-size: 0.85rem;
        }
        
        .two-col {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
            align-items: start;
        }
        
        @media (max-width: 860px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }
        /* team + closing extras */
        
        .team {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        
        .member {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px 18px;
            box-shadow: var(--shadow);
        }
        
        .member b {
            display: block;
            font-size: 0.95rem;
        }
        
        .member span {
            font-size: 0.75rem;
            color: var(--dim);
        }
        
        .linkbox {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: stretch;
            margin-top: 6px;
        }
        
        .linkcard {
            flex: 1 1 260px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        
        .linkcard:hover {
            transform: translateY(-2px);
            border-color: var(--acc, var(--red));
        }
        
        .linkcard:active {
            transform: translateY(0);
        }
        
        .linkcard b {
            display: block;
            font-size: 0.98rem;
        }
        
        .linkcard span {
            font-size: 0.8rem;
            color: var(--dim);
            font-family: ui-monospace, Consolas, monospace;
        }
        
        @media print {
            .deckbar {
                display: none;
            }
            .slide {
                min-height: auto;
                page-break-after: always;
            }
        }
        
        @media (max-width: 640px) {
            .slide {
                padding: 76px 6vw 48px;
            }
            .slide .snum {
                right: 6vw;
            }
            .fnode .arrow {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="deckbar">
        <span class="brand">ResQ<span>NET</span></span>
        <div class="progress">
            <div class="progress-fill" id="pf"></div>
        </div>
        <span class="counter" id="counter">1 / 25</span>
    </div>

    <main id="deck"></main>

    <script>
        /* =====================================================================
                   REUSABLE SLIDE COMPONENT — every slide renders through slideCard().
                   25 slides, organized into the 10 sections judges expect (PART 1–10)
                   in strict order. No emojis anywhere; typographic symbols only.
                   EDIT ME before presenting: member names (slide 1), links (slide 25).
                   ===================================================================== */
        function slideCard(s, n) {
            return `
  <section class="slide acc-${s.accent}" id="s${n}">
    <span class="snum">${String(n).padStart(2, '0')} / ${SLIDES.length}</span>
    <div class="content">
      <p class="kicker">${s.kicker}</p>
      <h2>${s.title}</h2>
      ${s.lede ? `<p class="lede">${s.lede}</p>` : ''}
      ${s.body}
      ${s.plain ? `<div class="plain"><b>IN PLAIN WORDS</b>${s.plain}</div>` : ''}
      ${s.foot ? `<p class="foot">${s.foot}</p>` : ''}
    </div>
  </section>`;
}
const stats = (pairs) => `<div class="stats">${pairs.map(([v, l]) =>
  `<div class="stat-chip"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const grid = (items) => `<div class="grid">${items.map(([h, p]) =>
  `<div class="mini"><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>`;
const ticks = (items) => `<ul class="ticks">${items.map(t => `<li>${t}</li>`).join('')}</ul>`;
const xs = (items) => `<ul class="xs">${items.map(t => `<li>${t}</li>`).join('')}</ul>`;
const flow = (nodes) => `<div class="flow">${nodes.map((n, i) =>
  `<div class="fnode"><b>${n[0]}</b>${n[1]}${i < nodes.length - 1 ? '<span class="arrow">▶</span>' : ''}</div>`).join('')}</div>`;

/* =====================================================================
   THE 25 SLIDES
   ===================================================================== */
const SLIDES = [

  /* ===== PART 1 · TITLE ===== */
  { accent: 'red', kicker: 'PART 1 · TITLE',
    title: 'ResQNET — <em>Offline AI Emergency Network</em>',
    lede: 'The network that refuses to die when everything else does. When towers fall and the internet is gone, ResQNET turns a crowd of ordinary phones into a coordinated rescue network — SOS, AI triage, and family alerts that travel phone-to-phone until they reach help.',
    body:
      stats([['0', 'towers needed'], ['0', 'accounts needed'], ['0', 'rupees to run'], ['86', 'tests passing']]) +
      `<div class="team">` +
      `<div class="member"><b>Team ResQNET</b><span>iQOO Hackathon 2026</span></div>` +
      `<div class="member"><b>Poloju Pravalika</b></div>` +
      `<div class="member"><b>Peesa Satvika</b></div>` +
      `<div class="member"><b>Inturi Vaishnavi</b></div>` +
      `</div>`,
    foot: '<b>GitHub:</b> <span style="font-family:ui-monospace,Consolas,monospace">github.com/Ppoloju/ResQNET</span> — every claim in this deck links to code and tests in the repository.' },

  /* ===== PART 2 · PROBLEM STATEMENT ===== */
  { accent: 'red', kicker: 'PART 2 · PROBLEM STATEMENT',
    title: 'Disasters don’t cut power first. <em>They cut connectivity.</em>',
    lede: 'Who faces it: every person in a flood, earthquake, cyclone or fire zone — and India sees all of them, every year. Why it matters: the first 60 minutes decide who survives, and that is exactly when networks fail.',
    body:
      `<div class="ps-grid">` +
      `<div class="ps-card ps-problem"><h3>THE PROBLEM</h3><ul>` +
      `<li><b>No connectivity when it matters most:</b> disasters overload or destroy cell towers exactly when people need to call 100/112.</li>` +
      `<li><b>Crowds cannot coordinate:</b> survivors meters apart have no way to share injuries, shelter or blocked-road information.</li>` +
      `<li><b>Batteries are scarce:</b> charging is unreliable for days — any solution that drains phones will not survive the disaster either.</li>` +
      `<li><b>People already have phones:</b> the only mass-market rescue radios available are the devices in survivors’ pockets.</li>` +
      `</ul></div>` +
      `<div class="ps-card ps-solution"><h3>OUR SOLUTION</h3><ul>` +
      `<li><b>One tap → SOS:</b> a signed emergency packet is created on-device — no account, no signal, no setup needed.</li>` +
      `<li><b>Phone-to-phone mesh:</b> nearby ResQNET phones relay the packet hop-by-hop (max 8 hops, 6 h lifetime) until one reaches the internet.</li>` +
      `<li><b>AI on the device:</b> classifies the emergency (medical / fire / trapped…) and guides first aid — fully offline, cannot hallucinate.</li>` +
      `<li><b>Real engineering:</b> 112 passing tests, encrypted medical data, Netlify-ready PWA, and a persistent API deployment contract — every claimed web feature is backed by code.</li>` +
      `</ul></div>` +
      `</div>`,
    plain: 'A fully-charged smartphone becomes a brick in every disaster. ResQNET’s problem statement: make that same phone the rescue network.' },

  { accent: 'amber', kicker: 'PART 2 · WHY IT MATTERS',
    title: 'The first 60 minutes of a disaster <em>decide who survives</em>',
    lede: 'Emergency services call it the “golden hour”. It is exactly the window when phone networks fail — and exactly the window ResQNET is built for.',
    body:
      stats([['72 h', 'people can survive trapped'], ['60 min', 'golden hour for rescue'], ['0', 'towers needed by ResQNET']]) +
      grid([
        ['Networks fail first', 'Earthquakes topple towers; floods drown equipment; everyone calling at once overloads what remains.'],
        ['Word of mouth is slow', 'Physically walking between survivors costs time and can be deadly — information needs to move at radio speed.'],
        ['Power is scarce', 'Charging is unreliable for days. Every feature must respect the battery, or it will not be there when needed.'],
        ['People already have phones', 'No new hardware to buy or distribute — the mesh is built from the devices already in survivors’ pockets.'],
      ]),
    plain: 'A phone that cannot call 100/112 is useless today. ResQNET makes that same phone useful tomorrow — by letting it shout through the crowd instead of through a tower.' },

  /* ===== PART 3 · EXISTING PROBLEMS / GAP ===== */
  { accent: 'purple', kicker: 'PART 3 · EXISTING SOLUTIONS & THE GAP',
    title: 'What exists today — and <em>why none of it is enough</em>',
    lede: 'Every existing option breaks exactly when a disaster does. This gap is ResQNET’s reason to exist.',
    body:
      `<div class="ps-grid">` +
      `<div class="ps-card"><h3>WHAT EXISTS</h3>` +
      xs([
        '<b>Cell calls & SMS</b> — need towers; towers are what failed.',
        '<b>Satellite messengers (Garmin, Zoleo)</b> — ₹30,000+ hardware nobody owns, per-message fees, licenses.',
        '<b>Government alert systems (CAP/SMS blasts)</b> — one-way broadcasts; you cannot send an SOS back.',
        '<b>WhatsApp / messengers</b> — need internet; also expose identity and phone number to strangers.',
        '<b>“Offline SOS” app concepts</b> — buttons that pop alerts; no mesh, no crypto, no backend. Demos, not systems.',
      ]) +
      `</div>` +
      `<div class="ps-card"><h3>THE GAP RESQNET FILLS</h3>` +
      ticks([
        '<b>Two-way SOS</b> — victims send emergencies out; responders and family answer back with ACKs.',

/* render + progress bar + keyboard nav */
const deck = document.getElementById('deck');
deck.innerHTML = SLIDES.map((s, i) => slideCard(s, i + 1)).join('');

const pf = document.getElementById('pf');
const counter = document.getElementById('counter');
const slides = [...document.querySelectorAll('.slide')];
counter.textContent = `1 / ${slides.length}`;
function updateProgress() {
  const idx = Math.min(slides.length - 1,
    slides.findIndex(el => el.getBoundingClientRect().bottom > window.innerHeight * 0.5));
  pf.style.width = `${((idx + 1) / slides.length) * 100}%`;
  counter.textContent = `${idx + 1} / ${slides.length}`;
}
document.addEventListener('scroll', updateProgress, { passive: true });
updateProgress();

document.addEventListener('keydown', (e) => {
  const current = slides.findIndex(el => el.getBoundingClientRect().bottom > window.innerHeight * 0.5);
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault();
    slides[Math.min(current + 1, slides.length - 1)]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
    e.preventDefault();
    slides[Math.max(current - 1, 0)]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'Home') slides[0]?.scrollIntoView();
  else if (e.key === 'End') slides[slides.length - 1]?.scrollIntoView();
});
    </script>
